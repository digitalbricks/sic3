<div class="uk-card uk-card-default">
    <div class="uk-card-header">
        <h2 class="uk-card-title">SIC and Satellite Settings</h2>
    </div>
    <div class="uk-card-body">
        <form class="uk-form-stacked" method="post"> {* action omitted in order to self-post *}
            <input type="hidden" name="csrf" value="{{ @tplCSRF }}">

            <fieldset class="uk-fieldset uk-margin-large-bottom">
                    <legend class="uk-legend uk-margin-small-bottom">SIC Settings</legend>
                    <label class="uk-form-label" for="satContact">
                        Number of concurrent requests <br>
                        <span class="uk-text-muted uk-margin-remove">
                            If you experience problems when using the refresh-all function, you may want to reduce this number. <br>
                            Especially if many of your sites are on the same server, web application firewalls may block too many concurrent requests.
                        </span>
                    </label>
                    <input type="number" class="uk-input" name="concurrentRequests" id="concurrentRequests" value="{{ @tplConcurrentRequests }}" min="1" max="20">
            </fieldset>

            <fieldset class="uk-fieldset">
                    <legend class="uk-legend uk-margin-small-bottom">Satellite Generation</legend>
                    <label class="uk-form-label" for="satContact">
                        Contact Information <br>
                        <span class="uk-text-muted uk-margin-remove">
                            The information provided here will be added to the auto-generates SIC satellite.php file.<br>
                            (The Auto-Generate Satellite Function is availabe on the site edit page.)
                        </span>
                    </label>

                    <div class="uk-form-controls">
                        {*
                        NOTE: Do not use indents or linebreaks inside <textarea>
                        to prevent input indendation and saving of empty newlines.
                        *}
                        <textarea name="satContact" id="satContact" class="uk-textarea" rows="5">{{ @tplSatContact }}</textarea>
                    </div>

                    <div class="uk-margin-top uk-flex uk-flex-between">
                        <div>
                            <a href="{{ @BASE }}/" class="uk-button uk-button-default">
                                <span class="uk-margin-small-right" data-uk-icon="icon: arrow-left"></span>
                                Back
                            </a>
                        </div>
                        <div>
                            <button type="submit" class="uk-button uk-button-danger">
                                <span class="uk-margin-small-right" data-uk-icon="icon: check"></span>
                                Save
                            </button>
                        </div>
                    </div>
            </fieldset>





        </form>
    </div>
</div>
